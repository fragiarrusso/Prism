name: Publish generalization demo
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: reviewer-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Verify the committed anonymous-host bundle is current
        run: git diff --exit-code -- index.html app.bundle.js
      - run: node --test tests/*.test.js
      - name: Stage only public site assets
        run: |
          mkdir site
          cp index.html styles.css app.bundle.js favicon.svg robots.txt .nojekyll site/
          cp -R data site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
